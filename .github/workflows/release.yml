# Release cmd on a version tag: publish the source package and prebuilt binary
# packages (mvx + UniData) as GitHub release assets.  The package registry
# indexes the assets via its release webhook (it hosts nothing).  Each job
# publishes to the same release; asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_') so the webhook maps them:
#   source                        -> mvx-lang_cmd-<ver>-source.tar.gz
#   mvx binary  (linux/x86_64,le) -> mvx-lang_cmd-<ver>-mvx-linux-x86_64-le.tar.gz
#   udt binary  (linux/x86_64,le) -> mvx-lang_cmd-<ver>-udt-linux-x86_64-le.tar.gz
#
# cmd is pure BASIC.  The source package is the BP/ programs (compiled on
# install); the mvx binary is the compiled subroutine library (LIB/libcmd.so)
# an account links with no recompile; the udt binary is the prebuilt UniData
# objects (BP/_CMD.*) that MVPKG-udt catalogs with no compiler.
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# Tag the bare version to release, e.g.:  git tag 0.2 && git push origin 0.2
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ---- source package: the BP/ programs, portable across MVX and UniData ----
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/cmd
          title: cmd
          body: "The cmd command framework (CMD.INIT / CMD.ADD / CMD.RUN). Source + prebuilt mvx binary; indexed by the package registry."

  # ---- mvx binary: compile the subroutine library against a published mvx ----
  mvx-binary:
    # The setup-mvx tarball is built on ubuntu-latest; run on a matching glibc.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cmd
        uses: actions/checkout@v5

      - name: Check out the mvx package tooling (scripts/mkpkg.sh)
        uses: actions/checkout@v5
        with:
          repository: mvx-lang/mvx
          path: .mvx-src
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false

      - name: Set up the mvx toolchain (latest published build)
        uses: mvx-lang/mvx/.github/actions/setup-mvx@main
        with:
          version: latest

      - name: Build the mvx binary package
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"                        # ubuntu-24.04 -> x86_64
          OS="$(uname -s | tr 'A-Z' 'a-z')"; case "$OS" in *linux*) OS=linux ;; esac
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          BASE="mvx-lang_cmd-$VER-mvx-$OS-$ARCH-$ENDIAN"

          # Compile BP/ into LIB/libcmd.so against the installed mvx-basic.
          MVXBASIC="$(command -v mvx-basic)" sh .mvx-src/scripts/mkpkg.sh .
          test -f LIB/libcmd.so

          # Assemble a binary-only package: the prebuilt LIB the runtime links,
          # plus the manifest/verb records — no BP source (installs identically
          # to a source package via LINK-PKG, with nothing to recompile).
          mkdir -p "dist/$BASE"
          cp -a LIB PKG mvpkg.json LICENSE README.md "dist/$BASE/"
          for d in VOC VOC.DICT LIB.DICT; do [ -e "$d" ] && cp -a "$d" "dist/$BASE/" || true; done
          rm -rf "dist/$BASE"/LIB/*.dSYM "dist/$BASE"/LIB/*.debug   # ship the library, not debug bundles
          tar czf "$BASE.tar.gz" -C "dist/$BASE" .   # contents at the tar root (no wrapping dir)
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the mvx binary asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt binary: prebuilt UniData objects, built in the udt-builder --------
  # Runs on the self-hosted udt runner; compiles BP/CMD.* to _objects in the
  # udt-builder container and ships them as an objects-only package (MVPKG-udt
  # catalogs the objects with no compiler).  Independent of the jobs above — if
  # the runner is offline this job is skipped/failed without affecting the
  # source and mvx assets, which the registry already indexes on their own.
  udt-binary:
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/cmd
